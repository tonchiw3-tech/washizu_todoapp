<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title" th:text="${displayYear + '年' + displayMonth + '月'}">2026年4月</h1>

        <nav class="calendar-navigation" aria-label="月の移動">
            <div class="calendar-navigation-group">
                <a class="btn sub" th:if="${!weekView}" th:href="@{/calendar(year=${previousMonth.year}, month=${previousMonth.monthValue})}">前の月</a>
                <a class="btn sub" th:if="${!weekView}" th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">次の月</a>
                <a class="btn sub" th:if="${weekView}" th:href="@{/calendar(view='week', year=${previousWeek.year}, month=${previousWeek.monthValue}, day=${previousWeek.dayOfMonth})}">前の週</a>
                <a class="btn sub" th:if="${weekView}" th:href="@{/calendar(view='week', year=${nextWeek.year}, month=${nextWeek.monthValue}, day=${nextWeek.dayOfMonth})}">次の週</a>
            </div>
            <div class="calendar-navigation-group">
                <a class="btn sub" th:href="@{/calendar(year=${displayYear}, month=${displayMonth})}">月</a>
                <a class="btn sub" th:href="@{/calendar(view='week', year=${displayYear}, month=${displayMonth}, day=${displayDay})}">週</a>
            </div>
            <div class="calendar-navigation-group">
                <a class="btn sub" th:href="@{/todos}">表で見る</a>
                <a class="btn" th:href="@{/todos/new}">新規登録</a>
            </div>
        </nav>

        <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${calendarWeeks}">
                    <th:block th:each="day : ${week}">
                        <td th:if="${day == null}"></td>
                        <td th:unless="${day == null}" th:attr="data-date=${day}" th:text="${day.dayOfMonth}"></td>
                    </th:block>
                </tr>
            </tbody>
        </table>
    </main>
</body>
<script>
    async function insertTodosIntoCalendar() {
        const calendarTable = document.querySelector('.calendar-table');
        const from = calendarTable.dataset.from;
        const to = calendarTable.dataset.to;
        const res = await fetch(`/api/todos?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
        const todos = await res.json();
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        for (const cell of calendarTable.querySelectorAll('td[data-date]')) {
            const date = cell.dataset.date;
            const matchingTodos = todos.filter(todo => todo.dueDate === date);

            for (const todo of matchingTodos.slice(0, 3)) {
                const title = document.createElement('a');
                title.href = `/todos/${todo.id}/edit`;
                title.textContent = todo.title;
                if (todo.dueDate < today && !todo.completed) {
                    title.style.color = 'red';
                }
                cell.append(document.createElement('br'), title);
            }

            const remainingCount = matchingTodos.length - 3;
            if (remainingCount > 0) {
                cell.append(
                    document.createElement('br'),
                    document.createTextNode(`ほか ${remainingCount}件`)
                );
            }
        }
    }

    let weatherByDate = {};

    async function insertWeatherIntoCalendar() {
        const calendarTable = document.querySelector('.calendar-table');
        const from = calendarTable.dataset.from;
        const to = calendarTable.dataset.to;
        try {
            const res = await fetch(`/api/weather?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
            if (res.ok) weatherByDate = await res.json();
        } catch (error) {
            weatherByDate = {};
        }
        for (const cell of calendarTable.querySelectorAll('td[data-date]')) {
            if (weatherByDate[cell.dataset.date]) {
                cell.append(document.createElement('br'), document.createTextNode(weatherByDate[cell.dataset.date]));
            }
        }
    }

    async function colorCalendarByHolidays() {
        const calendarTable = document.querySelector('.calendar-table');
        const from = calendarTable.dataset.from;
        const to = calendarTable.dataset.to;
        const res = await fetch(`/api/holidays?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
        const holidays = await res.json();

        if (res.headers.has('X-Holidays-Unavailable')) {
            const message = document.createElement('p');
            message.textContent = '祝日を取れませんでした';
            document.querySelector('main').prepend(message);
        }

        for (const cell of calendarTable.querySelectorAll('td[data-date]')) {
            const date = cell.dataset.date;
            const dayOfWeek = new Date(`${date}T00:00:00`).getDay();

            if (holidays[date]) {
                cell.style.backgroundColor = '#fff2cc';
                cell.style.color = '#0f172a';
                cell.title = holidays[date];
            } else if (dayOfWeek === 0) {
                cell.style.backgroundColor = '#fce4ec';
                cell.style.color = '#0f172a';
            } else if (dayOfWeek === 6) {
                cell.style.backgroundColor = '#e3f2fd';
                cell.style.color = '#0f172a';
            }
        }
    }

    insertTodosIntoCalendar();
    colorCalendarByHolidays();
    insertWeatherIntoCalendar();
</script>
</html>
