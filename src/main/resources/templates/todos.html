<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${trash ? '消したもの' : '一覧'}">一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <p class="flash" th:if="${message != null}" th:text="${message}">登録しました</p>

        <h1 class="page-title" th:text="${trash ? '🗑 消したもの' : '一覧'}">一覧</h1>

        <form class="search-bar" method="get" th:action="@{/todos}" th:unless="${trash}">
            <div>
                <label class="form-label" for="keyword">やること</label>
                <input class="form-input" id="keyword" name="keyword" type="text" th:value="${keyword}">
            </div>
            <div>
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </div>
            <input type="hidden" name="order" th:value="${order}">
            <label><input type="checkbox" name="includeCompleted" value="true" th:checked="${includeCompleted}"> 完了したものも表示する</label>
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', includeCompleted=${includeCompleted})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', includeCompleted=${includeCompleted})}">期限が遠い順</a>
        </form>

        <p th:unless="${trash}">
            <a class="btn" th:href="@{/todos/new}">新規登録</a>
            <a class="btn sub" href="/todos?trash=1" th:unless="${trash}">削除済み</a>
            <a class="btn sub" th:href="@{/calendar}">カレンダーで見る</a>
        </p>
        <p th:if="${trash}"><a class="btn sub" href="/todos">通常一覧</a></p>

        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr th:if="${trash}">
                    <th>やること</th>
                    <th>消した日時</th>
                    <th>操作</th>
                </tr>
                <tr th:unless="${trash}">
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(#temporals.createToday()) and !todo.completed} ? ' overdue'">
                    <td th:unless="${trash}">
                        <form th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post" class="pin-form">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <input type="hidden" name="category" th:value="${category}">
                            <input type="hidden" name="order" th:value="${order}">
                            <input type="hidden" name="includeCompleted" th:value="${includeCompleted}">
                            <input type="hidden" name="page" th:value="${currentPage}">
                            <button type="submit" class="pin-button" th:aria-label="${todo.pinned ? '印を外す' : '印を付ける'}" th:text="${todo.pinned ? '★' : '☆'}">☆</button>
                            <span th:text="${todo.title}">やること</span>
                        </form>
                    </td>
                    <td th:unless="${trash}" th:text="${todo.category}">ジャンル</td>
                    <td th:unless="${trash}">
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span>
                        <span class="priority-mark" th:if="${todo.priority == 1}" aria-label="最優先">★</span>
                    </td>
                    <td th:unless="${trash}" th:text="${todo.dueDate != null ? todo.dueDate : '（入力なし）'}">期限</td>
                    <td th:if="${trash}" th:text="${todo.title}">やること</td>
                    <td th:if="${trash}" th:text="${#temporals.format(todo.deletedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td th:unless="${trash}" th:text="${todo.completed ? '完了' + (todo.completedAt != null ? ' ' + #temporals.format(todo.completedAt, 'yyyy-MM-dd') : '') : '未完了'}">状態</td>
                    <td th:unless="${trash}">
                        <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}" th:unless="${trash}">編集</a>
                        <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}" th:unless="${trash}">削除</a>
                    </td>
                    <td th:if="${trash}"><form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post"><button class="btn sub restore-btn" type="submit">戻す</button></form></td>
                </tr>
            </tbody>
        </table>

        <nav class="pagination" th:if="${totalPages > 1}" aria-label="ページ移動">
            <a class="link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
               th:href="${trash} ? @{/todos(trash=1, page=${pageNumber})} : @{/todos(keyword=${keyword}, category=${category}, order=${order}, includeCompleted=${includeCompleted}, page=${pageNumber})}"
               th:text="${pageNumber}"
               th:classappend="${pageNumber == currentPage} ? ' current'">1</a>
        </nav>
    </main>
</body>
</html>
